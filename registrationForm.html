<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <link rel="stylesheet" href="registrationForm.css">
</head>
<body>

    <header>
        <h1>User Registration Form</h1>
    </header>

    <main>

        <form>

            <section>
                <label for="fullname">
                    Full Name
                </label>

                <input 
                    type="text" 
                    id="fullname"
                    placeholder="Enter your full name"
                >
            </section>

            <section>
                <label for="email">
                    Email Address
                </label>

                <input 
                    type="email" 
                    id="email"
                    placeholder="Enter your email"
                >
            </section>

            <section>
                <label for="password">
                    Password
                </label>

                <input 
                    type="password" 
                    id="password"
                    placeholder="Enter password"
                >
            </section>

            <section>
                <label for="phone">
                    Phone Number
                </label>

                <input 
                    type="tel" 
                    id="phone"
                    placeholder="Enter phone number"
                >
            </section>

            <button type="submit">
                Register
            </button>

        </form>

    </main>

</body>
</html>
