<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Login</title>

    <link rel="stylesheet" href="SocialMediaLogin.css">
</head>
<body>

    <main>

        <form>

            <h1>Login</h1>

            <section>
                <label for="email">
                    Email Address
                </label>

                <input 
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >
            </section>

            <section>
                <label for="password">
                    Password
                </label>

                <input 
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >
            </section>

            <button type="submit" class="login-btn">
                Login
            </button>

            <p class="or">
                OR
            </p>

            <button type="button" class="google-btn">
                Login with Google
            </button>

            <button type="button" class="facebook-btn">
                Login with Facebook
            </button>

            <nav>
                <a href="#">
                    Forgot Password?
                </a>

                <a href="#">
                    Create Account
                </a>
            </nav>

        </form>

    </main>

</body>
</html>
