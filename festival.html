<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Shopping</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="festival.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-6 col-xl-5 p-6 text-center">
                <div class="bg-image d-flex flex-column justify-content-end">
                    <h1 class="text-light text-left m-2">Diwali Special</h1>
                    <p class="text-light text-left m-2">Up to 50% Off</p>
                    <div class="d-flex flex-row justify-content-start">
                        <button class="btn border-light text-light m-2 mb-0">Shop Now</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-6 col-xl-5 p-6 text-center">
                <div class="bg2-image d-flex flex-column justify-content-end">
                    <h1 class="text-light text-left m-2">Eid Collection</h1>
                    <p class="text-light text-left m-2">Exclusive Offers</p>
                    <div class="d-flex flex-row justify-content-start">
                        <button class="btn border-light text-light m-2 mb-0">Shop Now</button>
                    </div>
                </div>
            </div>
            <div class="col-12 text-right">
                <button class="btn text-light m-2" style="background-color: #1754a1;">View All</button>
            </div>
        </div>
    </div>
</body>
</html>
